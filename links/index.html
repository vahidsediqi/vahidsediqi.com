<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100dvh}
body{
  background:#F6F7FB;
  color:#0B1530;
  font-family:'Geist',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px 20px;
}
a{text-decoration:none;color:inherit}

@keyframes blob{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(30px,-20px) scale(1.06)}
  66%{transform:translate(-20px,15px) scale(.96)}
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

/* BACKGROUND */
.bg{
  position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;
}
.blob{
  position:absolute;border-radius:50%;filter:blur(60px);
}
.blob-1{
  width:600px;height:600px;
  left:-150px;top:-200px;
  background:radial-gradient(circle,rgba(79,70,229,.18),transparent 65%);
  animation:blob 20s ease-in-out infinite;
}
.blob-2{
  width:500px;height:500px;
  right:-100px;bottom:-150px;
  background:radial-gradient(circle,rgba(14,165,233,.16),transparent 65%);
  animation:blob 26s ease-in-out infinite reverse;
}
.blob-3{
  width:400px;height:400px;
  left:40%;top:30%;
  background:radial-gradient(circle,rgba(124,58,237,.12),transparent 65%);
  animation:blob 22s ease-in-out infinite 8s;
}
.grid-bg{
  position:absolute;inset:0;
  background-image:linear-gradient(rgba(11,21,48,.04) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(11,21,48,.04) 1px,transparent 1px);
  background-size:52px 52px;
  -webkit-mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,#000 30%,transparent 80%);
  mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,#000 30%,transparent 80%);
}

/* CARD */
.card{
  position:relative;z-index:1;
  width:100%;max-width:480px;
  display:flex;flex-direction:column;
  gap:10px;
  animation:fadeUp .7s cubic-bezier(.2,.7,.2,1) both;
}

/* PROFILE */
.profile{
  display:flex;flex-direction:column;align-items:center;
  gap:14px;text-align:center;
  padding:32px 24px 28px;
  border-radius:28px;
  background:rgba(255,255,255,.65);
  border:1px solid rgba(255,255,255,.8);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  box-shadow:0 8px 32px -16px rgba(11,21,48,.15);
  animation:fadeUp .7s cubic-bezier(.2,.7,.2,1) .05s both;
}
.avatar{
  width:80px;height:80px;border-radius:50%;
  background:linear-gradient(135deg,#4F46E5,#7C3AED 50%,#0EA5E9);
  display:grid;place-items:center;
  box-shadow:0 12px 28px -10px rgba(79,70,229,.5);
  flex-shrink:0;
}
.avatar img{
  width:100%;height:100%;border-radius:50%;object-fit:cover;
}
.profile-name{
  font-size:22px;font-weight:600;letter-spacing:-.03em;
}
.profile-handle{
  font-size:14.5px;color:#5A6480;
}
.profile-tags{
  display:flex;flex-wrap:wrap;justify-content:center;gap:6px;
}
.profile-tag{
  font-size:12.5px;padding:4px 10px;border-radius:999px;
  background:rgba(79,70,229,.08);color:#4338CA;font-weight:500;
}

/* LINK ITEMS */
.link-item{
  display:flex;align-items:center;gap:16px;
  padding:16px 18px;
  border-radius:20px;
  background:rgba(255,255,255,.65);
  border:1px solid rgba(255,255,255,.8);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  box-shadow:0 4px 20px -12px rgba(11,21,48,.2);
  transition:transform .35s cubic-bezier(.2,.7,.2,1),
             box-shadow .35s ease,
             border-color .35s ease,
             background .25s ease;
  cursor:pointer;
}
.link-item:hover{
  transform:translateY(-4px);
  border-color:rgba(79,70,229,.25);
  background:rgba(255,255,255,.9);
  box-shadow:0 20px 40px -20px rgba(79,70,229,.35);
}
.link-item:nth-child(2){animation-delay:.1s}
.link-item:nth-child(3){animation-delay:.17s}
.link-item:nth-child(4){animation-delay:.24s}
.link-item:nth-child(5){animation-delay:.31s}

.link-icon{
  width:46px;height:46px;border-radius:14px;
  display:grid;place-items:center;flex-shrink:0;
  font-size:22px;
}
.link-text{flex:1;min-width:0}
.link-title{font-size:16px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.link-url{font-size:13px;color:#5A6480;margin-top:2px}
.link-arrow{
  width:34px;height:34px;border-radius:10px;
  background:rgba(11,21,48,.06);
  display:grid;place-items:center;flex-shrink:0;
  font-size:15px;color:#5A6480;
  transition:background .25s,color .25s,transform .3s;
}
.link-item:hover .link-arrow{
  background:#0B1530;color:#fff;transform:rotate(-45deg);
}

/* FOOTER */
.links-footer{
  text-align:center;padding:12px;
  font-size:13px;color:#9AA2BC;
  animation:fadeUp .7s cubic-bezier(.2,.7,.2,1) .5s both;
}
.links-footer a{color:#9AA2BC}
.links-footer a:hover{color:#4F46E5}
</style>
</head>
